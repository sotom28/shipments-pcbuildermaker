spring.application.name=shipments-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8084
spring.jpa.open-in-view=false

# Kafka: shipments publica SHIPMENT_CREATED / SHIPMENT_STATUS_CHANGED en shipment-events (lo consume analytics).
# shipments.kafka.enabled=false apaga la publicacion (tests, o correr sin broker).
shipments.kafka.enabled=${SHIPMENTS_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Con Kafka caido el envio igual se crea: send() espera como maximo unos segundos y luego solo se registra el error.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
